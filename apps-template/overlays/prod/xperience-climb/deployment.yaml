apiVersion: v1
kind: ServiceAccount
metadata:
  name: xperience-climb-sa
  namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xperience-climb
  namespace: apps
  labels:
    app: xperience-climb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xperience-climb
  template:
    metadata:
      labels:
        app: xperience-climb
    spec:
      serviceAccountName: xperience-climb-sa
      containers:
        - name: api
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/xperience-climb:v1.2.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: xperience-db-credentials
                  key: url
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
