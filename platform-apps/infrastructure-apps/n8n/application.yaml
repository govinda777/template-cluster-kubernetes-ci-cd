apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/govinda777/template-cluster-kubernetes-ci-cd.git'
    targetRevision: feature/n8n-install
    path: 'platform-apps/infrastructure-apps/n8n'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: platform-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
