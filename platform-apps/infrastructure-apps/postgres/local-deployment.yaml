apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-dev
  namespace: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql-dev
  template:
    metadata:
      labels:
        app: postgresql-dev
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: n8n
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-dev-credentials
                  key: postgres-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-dev
  namespace: database
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgresql-dev
